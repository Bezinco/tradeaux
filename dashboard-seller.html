<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>TradeAux • Seller Dashboard</title>
  
  <!-- Add this meta tag to prevent caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ... all your existing styles ... */
  </style>
</head>
<body>
  <!-- ... all your HTML ... -->

  <script>
  // ============================================================
  // SIMPLE DASHBOARD - FORCE RELOAD ON SIGN IN
  // ============================================================

  // ============================================================
  // CHECK IF WE JUST CAME FROM SIGN IN
  // ============================================================
  (function() {
    // If we have a sign-in flag, force a hard reload
    if (sessionStorage.getItem('tradeaux_just_signed_in') === 'true') {
      sessionStorage.removeItem('tradeaux_just_signed_in');
      // Force a hard reload from server, not cache
      window.location.reload(true);
      return;
    }
  })();

  // ============================================================
  // DOM HELPERS
  // ============================================================
  function $(id) { return document.getElementById(id); }
  function money(n) { return (n === undefined || n === null || isNaN(n)) ? '$0.00' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function escapeHtml(s) { if (s === null || s === undefined) return ''; var div = document.createElement('div'); div.textContent = String(s); return div.innerHTML; }
  
  function showToast(msg, type) { 
    type = type || 'info';
    var t = $('toast');
    if(!t) return;
    t.textContent = msg.length > 60 ? msg.substring(0, 57) + '...' : msg;
    t.className = 'toast visible ' + type;
    clearTimeout(t._timeout);
    t._timeout = setTimeout(function() { t.className = 'toast'; }, 4000);
  }

  // ============================================================
  // STORAGE - DIRECT, NO COMPLEXITY
  // ============================================================
  const STORAGE_KEY = 'tradeaux_seller_state';

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch(e) {
      console.warn('Failed to load data:', e);
      return null;
    }
  }

  function saveData(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch(e) {
      console.warn('Failed to save data:', e);
      return false;
    }
  }

  // ============================================================
  // APP STATE - DIRECT FROM STORAGE
  // ============================================================
  var APP = {
    wallet: { balance: 0 },
    company: { name: '', reg: '', country: '', tax: '', address: '', email: '', phone: '', website: '', verified: 'pending', logo: null, documents: {}, photos: [] },
    products: [],
    orders: [],
    receivables: [],
    conversions: [],
    briefs: [],
    archivedAuctions: [],
    certToggles: { incorporation: true },
    selectedAuctionType: 'standard',
    tar: {
      active: true,
      conversionFee: 25,
      minReceivable: 100,
      maxReceivable: 50000,
      autoConvert: true,
      batchSize: 50,
      dailyLimit: 500,
      todayConversions: 0,
      todayConversionsDate: '',
      totalConversions: 0,
      totalFeesEarned: 0
    }
  };

  // ============================================================
  // LOAD DATA ON PAGE START
  // ============================================================
  function loadAppData() {
    var savedData = loadData();
    if (savedData) {
      if (savedData.wallet) APP.wallet = savedData.wallet;
      if (savedData.company) APP.company = savedData.company;
      if (savedData.products) APP.products = savedData.products;
      if (savedData.orders) APP.orders = savedData.orders;
      if (savedData.receivables) APP.receivables = savedData.receivables;
      if (savedData.conversions) APP.conversions = savedData.conversions;
      if (savedData.certToggles) APP.certToggles = savedData.certToggles;
      if (savedData.briefs) APP.briefs = savedData.briefs;
      if (savedData.archivedAuctions) APP.archivedAuctions = savedData.archivedAuctions;
      if (savedData.selectedAuctionType) APP.selectedAuctionType = savedData.selectedAuctionType;
      if (savedData.tar) APP.tar = savedData.tar;
    }
  }

  // Load data immediately
  loadAppData();

  // ============================================================
  // HEADER LOGO UPLOADS
  // ============================================================
  function setupHeaderLogos() {
    var leftLogo = $('headerLogoLeft');
    var rightLogo = $('headerLogoRight');
    var leftInput = $('headerLogoLeftInput');
    var rightInput = $('headerLogoRightInput');

    function loadLogo(key, el) {
      try {
        var data = localStorage.getItem(key);
        if (data) {
          el.innerHTML = '';
          var img = document.createElement('img');
          img.src = data;
          img.alt = 'Company logo';
          el.appendChild(img);
        }
      } catch(e) {}
    }

    function handleUpload(input, key, el) {
      var file = input.files[0];
      if (!file) return;
      var valid = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
      if (valid.indexOf(file.type) === -1) {
        showToast('Invalid file type. Please upload JPG, PNG, GIF, or WEBP.', 'error');
        input.value = '';
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        showToast('File too large. Max 2MB.', 'error');
        input.value = '';
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) {
        try { localStorage.setItem(key, e.target.result); } catch(err) { showToast('Failed to save logo', 'error'); return; }
        el.innerHTML = '';
        var img = document.createElement('img');
        img.src = e.target.result;
        img.alt = 'Company logo';
        el.appendChild(img);
        showToast('✅ Logo uploaded!', 'success');
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    if (leftLogo && leftInput) {
      leftLogo.onclick = function(e) { e.preventDefault(); leftInput.click(); };
      leftInput.onchange = function(e) { handleUpload(this, 'headerLogoLeftData', leftLogo); };
      loadLogo('headerLogoLeftData', leftLogo);
    }
    if (rightLogo && rightInput) {
      rightLogo.onclick = function(e) { e.preventDefault(); rightInput.click(); };
      rightInput.onchange = function(e) { handleUpload(this, 'headerLogoRightData', rightLogo); };
      loadLogo('headerLogoRightData', rightLogo);
    }
  }

  // ============================================================
  // COMPANY NAME EDITING
  // ============================================================
  function setupCompanyName() {
    var nameSpan = $('companyNameDisplay');
    var fullNameDisplay = $('companyNameDisplayFull');
    
    // Load saved name - prioritize APP data
    if (APP.company.name && APP.company.name !== '') {
      if (nameSpan) nameSpan.textContent = APP.company.name;
      if (fullNameDisplay) fullNameDisplay.textContent = APP.company.name;
      try { localStorage.setItem('companyDisplayName', APP.company.name); } catch(e) {}
    } else {
      try {
        var savedName = localStorage.getItem('companyDisplayName');
        if (savedName) {
          if (nameSpan) nameSpan.textContent = savedName;
          if (fullNameDisplay) fullNameDisplay.textContent = savedName;
        }
      } catch(e) {}
    }

    if (nameSpan) {
      nameSpan.style.cursor = 'pointer';
      nameSpan.title = 'Click to edit company name';
      nameSpan.addEventListener('click', function(e) {
        var current = this.textContent;
        var newName = prompt('Enter your company name:', current);
        if (newName !== null && newName.trim() !== '') {
          var trimmed = newName.trim();
          this.textContent = trimmed;
          if (fullNameDisplay) fullNameDisplay.textContent = trimmed;
          APP.company.name = trimmed;
          try { localStorage.setItem('companyDisplayName', trimmed); } catch(err) {}
          saveData(APP);
          showToast('✅ Company name updated!', 'success');
        }
      });
    }
  }

  // ============================================================
  // RENDER FUNCTIONS - SIMPLE
  // ============================================================
  function renderCompany() {
    var c = APP.company;
    var fields = ['companyNameDisplayFull', 'companyRegDisplay', 'companyCountryDisplay', 'companyTaxDisplay', 'companyAddressDisplay', 'companyEmailDisplay', 'companyPhoneDisplay', 'companyWebsiteDisplay'];
    var vals = [c.name, c.reg, c.country, c.tax, c.address, c.email, c.phone, c.website];
    fields.forEach(function(id, i) {
      var el = $(id);
      if(el) {
        var v = vals[i];
        el.textContent = (v === undefined || v === null || v === '' || v === 'undefined' || v === 'null') ? 'Not set' : escapeHtml(String(v));
      }
    });
    
    var badge = $('verificationBadge');
    if(badge) {
      badge.className = 'company-verification-badge ' + (c.verified || 'pending');
      badge.textContent = c.verified === 'verified' ? '✅ Verified' : c.verified === 'pending' ? '⏳ Pending Verification' : '❌ Unverified';
    }
    
    var status = $('companyStatusText');
    if(status) status.textContent = c.verified === 'verified' ? '✅ Ready to sell.' : '📝 Complete your profile.';
    
    var preview = $('companyLogoPreview');
    var placeholder = $('logoPlaceholder');
    if (c.logo && c.logo.startsWith('data:')) {
      if(preview) { preview.src = c.logo; preview.style.display = 'block'; }
      if(placeholder) placeholder.style.display = 'none';
    } else {
      if(preview) { preview.style.display = 'none'; }
      if(placeholder) placeholder.style.display = 'flex';
    }
    
    // Photos
    var photos = $('photosGrid');
    if(photos) {
      photos.innerHTML = '';
      var p = APP.company.photos || [];
      p.forEach(function(src) {
        if (src && src.startsWith('data:')) {
          var div = document.createElement('div');
          div.className = 'photo-item';
          var img = document.createElement('img');
          img.src = src;
          img.alt = 'Company photo';
          div.appendChild(img);
          photos.appendChild(div);
        }
      });
      var upload = document.createElement('button');
      upload.className = 'photo-upload-btn';
      upload.setAttribute('type', 'button');
      upload.innerHTML = '<span class="icon" aria-hidden="true">📷</span><span class="text">Add Photo</span>';
      upload.onclick = function() { var input = $('photoFileInput'); if(input) input.click(); };
      photos.appendChild(upload);
    }
    
    var docs = c.documents || {};
    var incorp = $('incorpDocStatus');
    var lic = $('licenseDocStatus');
    var tax = $('taxDocStatus');
    if(incorp) incorp.textContent = docs.incorporation ? '✅ Uploaded' : 'Not uploaded';
    if(lic) lic.textContent = docs.license ? '✅ Uploaded' : 'Not uploaded';
    if(tax) tax.textContent = docs.tax ? '✅ Uploaded' : 'Not uploaded';
  }

  function renderStats() {
    var tp = $('totalProducts');
    var to = $('totalOrders');
    var tr = $('totalRevenue');
    var tc = $('totalConversions');
    if(tp) tp.textContent = APP.products ? APP.products.length : 0;
    if(to) to.textContent = APP.orders ? APP.orders.length : 0;
    var rev = 0;
    if(APP.orders) {
      APP.orders.forEach(function(o) {
        if(o.status === 'completed' || o.status === 'shipped') rev += Number(o.total) || 0;
      });
    }
    if(tr) tr.textContent = money(rev);
    if(tc) tc.textContent = APP.tar.totalConversions || 0;
  }

  function renderWallet() {
    var w = $('walletAmount');
    if(w) w.textContent = money(APP.wallet.balance);
    var cap = $('conversionCapacity');
    if(cap) { var c = Math.floor(APP.wallet.balance / 25); cap.textContent = c + ' conversions'; }
  }

  function renderCertificates() {
    var grid = $('certGrid');
    if(!grid) return;
    grid.innerHTML = '';
    var types = ['incorporation'].concat(Object.keys(APP.certToggles || {}).filter(function(k) { return k !== 'incorporation'; }).sort());
    types.forEach(function(type) {
      var info = {
        incorporation: { icon: '🏢', label: 'Incorporation', desc: 'Required - Admin Verified' },
        export: { icon: '📄', label: 'Export License', desc: 'Government export capacity' },
        organic: { icon: '🌱', label: 'Organic', desc: 'Organic certification' },
        fairtrade: { icon: '🤝', label: 'Fair Trade', desc: 'Fair Trade certified' },
        kosher: { icon: '✡️', label: 'Kosher', desc: 'Kosher certified' },
        halal: { icon: '☪️', label: 'Halal', desc: 'Halal certified' },
        brcgs: { icon: '🔒', label: 'BRCGS', desc: 'BRC Global Standards' },
        origin: { icon: '🌍', label: 'Origin', desc: 'Certificate of Origin' },
        'IFS Food': { icon: '🍽️', label: 'IFS Food', desc: 'International Featured Standards' },
        SQF: { icon: '✅', label: 'SQF', desc: 'Safe Quality Food' },
        'FSSC 22000': { icon: '🔐', label: 'FSSC 22000', desc: 'Food Safety System Certification' },
        HACCP: { icon: '🛡️', label: 'HACCP', desc: 'Hazard Analysis Critical Control Point' },
        GMP: { icon: '🏭', label: 'GMP', desc: 'Good Manufacturing Practice' },
        USDA: { icon: '🇺🇸', label: 'USDA Organic', desc: 'USDA Organic certification' },
        EU: { icon: '🇪🇺', label: 'EU Organic', desc: 'EU Organic certification' },
        'Canada Inspection Agency': { icon: '🇨🇦', label: 'CIA (Canada)', desc: 'Canadian Inspection Agency' },
        JAS: { icon: '🇯🇵', label: 'JAS', desc: 'Japanese Agricultural Standard' },
        'Soil Association': { icon: '🌿', label: 'Soil Association', desc: 'Soil Association Organic' },
        'ECO Cert': { icon: '🌎', label: 'ECO Cert', desc: 'ECO Cert organic' },
        'Rainforest Alliance': { icon: '🐸', label: 'Rainforest Alliance', desc: 'Rainforest Alliance certified' },
        other: { icon: '📎', label: 'Other', desc: 'Additional certification' }
      }[type] || { icon: '📄', label: type, desc: '' };
      
      var required = type === 'incorporation';
      var verified = APP.certToggles[type] || false;
      var div = document.createElement('div');
      div.className = 'cert-block';
      div.dataset.certType = type;
      
      var img = APP.company.documents ? APP.company.documents[type] : null;
      var html;
      if(img && typeof img === 'string' && img.startsWith('data:')) {
        var isPdf = img.startsWith('data:application/pdf');
        if(isPdf) {
          html = '<div class="cert-preview" role="button" tabindex="0">' +
            '<span style="font-size:24px;">📄</span>' +
            '<span style="font-size:9px;color:#7CFC00;margin-left:4px;">PDF uploaded</span>' +
            '</div>';
        } else {
          html = '<div class="cert-preview" role="button" tabindex="0">' +
            '<img src="' + escapeHtml(img) + '" alt="' + escapeHtml(info.label) + ' certificate" style="width:100%;height:100%;object-fit:cover;">' +
            '</div>';
        }
      } else {
        html = '<div class="cert-preview" role="button" tabindex="0">' +
          '<span class="placeholder">📤 Upload</span>' +
          '</div>';
      }
      
      var toggle = required ? '<span style="font-size:9px;color:#7CFC00;">🔒 Admin Verified</span>' :
        '<div class="cert-toggle-row"><span>' + (verified ? '✅ Verified' : '⏳ Pending') + '</span><label class="toggle-switch"><input type="checkbox" data-cert="' + type + '" ' + (verified ? 'checked' : '') + '><span class="slider"></span></label></div>';
      div.innerHTML = '<div class="cert-icon">' + info.icon + '</div><div class="cert-name">' + escapeHtml(info.label) + '</div><div class="cert-desc">' + escapeHtml(info.desc) + '</div>' + (required ? '<div class="cert-required">★ REQUIRED</div>' : '') + html + toggle;
      grid.appendChild(div);
    });
  }

  function renderProducts() {
    var grid = $('productsGrid');
    if(!grid) return;
    grid.innerHTML = '';
    
    var add = document.createElement('div');
    add.className = 'add-product-card';
    add.innerHTML = '<div class="add-product-icon">+</div><div class="add-product-text">Add Product</div>';
    add.onclick = function() { showToast('📦 Add Product modal coming soon!', 'info'); };
    grid.appendChild(add);
    
    if(!APP.products || APP.products.length === 0) {
      var m = document.createElement('div');
      m.style.cssText = 'grid-column:1/-1;text-align:center;padding:20px;color:#666;font-size:12px;';
      m.textContent = 'No products yet. Click "Add Product" to get started.';
      grid.appendChild(m);
      return;
    }
    
    APP.products.forEach(function(p) {
      var card = document.createElement('div');
      var auctionType = p.auctionType || 'standard';
      card.className = 'product-card ' + auctionType;
      card.innerHTML = '<div class="cartouche">' + auctionType.toUpperCase() + '</div>' +
        '<div class="product-name">' + escapeHtml(p.name) + '</div>' +
        '<div style="font-size:11px;color:#9ca3af;">📦 ' + escapeHtml(p.quantity || 0) + ' MT</div>';
      grid.appendChild(card);
    });
  }

  function renderOrders() {
    var grid = $('ordersGrid');
    if(!grid) return;
    grid.innerHTML = '';
    if(!APP.orders || APP.orders.length === 0) { 
      grid.innerHTML = '<div style="color:#9ca3af;text-align:center;padding:40px;grid-column:1/-1;">No orders yet.</div>'; 
      return; 
    }
    APP.orders.forEach(function(o) {
      var card = document.createElement('div');
      card.className = 'order-card';
      var status = o.status || 'pending';
      card.innerHTML = '<div class="order-header"><div class="order-id">#' + escapeHtml(o.id.slice(0, 8)) + '</div><div class="order-status ' + escapeHtml(status) + '">' + escapeHtml(status.toUpperCase()) + '</div></div>' +
        '<div class="order-details"><div><span class="label">Product:</span> ' + escapeHtml(o.product || 'Unknown') + '</div><div><span class="label">Total:</span> ' + money(o.total || 0) + '</div></div>';
      grid.appendChild(card);
    });
  }

  function renderTAR() {
    var receivables = APP.receivables || [];
    var ready = receivables.filter(function(r) { return r.status === 'ready' && !r.converted; }).length;
    var pending = receivables.filter(function(r) { return r.status === 'pending' && !r.converted; }).length;
    var converted = receivables.filter(function(r) { return r.converted; }).length;
    
    var readyCount = $('tarReadyCount');
    var pendingCount = $('tarPendingCount');
    var convertedCount = $('tarConvertedCount');
    var feesEarned = $('tarFeesEarned');
    var todayConversions = $('todayConversions');
    var todayFees = $('todayFees');
    var remainingCapacity = $('remainingCapacity');
    
    if(readyCount) readyCount.textContent = ready;
    if(pendingCount) pendingCount.textContent = pending;
    if(convertedCount) convertedCount.textContent = converted;
    if(feesEarned) feesEarned.textContent = money(APP.tar.totalFeesEarned || 0);
    if(todayConversions) todayConversions.textContent = APP.tar.todayConversions || 0;
    if(todayFees) todayFees.textContent = money((APP.tar.todayConversions || 0) * 25);
    if(remainingCapacity) remainingCapacity.textContent = Math.max(0, 10000 - (APP.tar.totalConversions || 0));
    
    var list = $('tarReceivablesList');
    if(list) {
      var all = receivables.filter(function(r) { return !r.converted; });
      if(all.length === 0) { list.innerHTML = '<div style="color:#7CFC00;text-align:center;padding:20px;font-size:13px;">✅ All receivables have been converted!</div>'; } else {
        var html = all.map(function(r) {
          var days = r.createdAt ? Math.floor((Date.now() - r.createdAt) / 86400000) : 0;
          var st = r.status || 'pending';
          return '<div class="tar-receivable-item"><div class="tar-receivable-info"><div class="receivable-name">' + escapeHtml(r.company) + ' • ' + escapeHtml(r.product) + '</div><div class="receivable-details">' + escapeHtml(r.invoiceNumber) + ' • ' + days + 'd old</div></div><div style="display:flex;align-items:center;gap:8px;"><span class="receivable-amount">' + money(r.amount) + '</span><span class="receivable-status ' + escapeHtml(st) + '">' + escapeHtml(st.toUpperCase()) + '</span></div></div>';
        }).join('');
        list.innerHTML = html;
      }
    }
  }

  function renderArchive() {
    var grid = $('archiveGrid');
    var count = $('archiveCount');
    if(!grid) return;
    var archived = APP.archivedAuctions || [];
    if(count) count.textContent = archived.length;
    
    if(archived.length === 0) {
      grid.innerHTML = '<div style="color:#9ca3af;text-align:center;padding:20px;grid-column:1/-1;">No archived auctions yet.</div>';
      return;
    }
    
    var html = archived.slice(0, 20).map(function(a) {
      var date = a.scheduledDate ? new Date(a.scheduledDate).toLocaleDateString() : 'Unknown';
      var name = a.productName || a.product || 'Unnamed Auction';
      var qty = a.quantity || 0;
      var price = a.finalPrice || a.startingPrice || a.idealPrice || 0;
      return '<div class="archive-card"><div class="archive-status">' + (a.won ? '✅ WON' : '❌ LOST') + '</div><div class="archive-date">' + date + '</div><div class="archive-name">' + escapeHtml(name) + '</div><div class="archive-details">' + escapeHtml(qty) + ' units</div><div class="archive-metrics"><div class="metric-item"><div class="metric-value">' + money(price) + '</div><div class="metric-label">Price</div></div></div></div>';
    }).join('');
    grid.innerHTML = html;
  }

  function renderAuctionSchedule() {
    var list = $('auctionList');
    if(!list) return;
    var briefs = APP.briefs || [];
    var upcoming = briefs.filter(function(b) { return !b.archived && (b.status === 'scheduled' || b.status === 'live'); });
    if(upcoming.length === 0) { list.innerHTML = '<div style="color:#9ca3af;text-align:center;padding:10px;font-size:11px;">No active auctions. Create one from your products!</div>'; return; }
    list.innerHTML = upcoming.slice(0, 5).map(function(b) {
      var d = new Date(b.auctionTime || Date.now());
      var date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      var time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      var cls = b.status === 'live' ? 'live' : 'upcoming';
      return '<div class="auction-item"><div class="auction-info"><div class="auction-name">' + escapeHtml(b.product || 'Unnamed Auction') + '</div><div class="auction-details">' + escapeHtml(b.quantity || 0) + ' units</div></div><div style="text-align:right;"><div class="auction-time">' + date + ' ' + time + '</div><div class="auction-status ' + cls + '">' + escapeHtml((b.status || 'scheduled').toUpperCase()) + '</div></div></div>';
    }).join('');
  }

  function renderTARAdvisory() {
    var text = $('tarAdvisoryText');
    if(!text) return;
    var briefs = APP.briefs || [];
    var archived = APP.archivedAuctions || [];
    var total = briefs.length;
    var archivedCount = archived.length;
    var msg = 'You have <span class="highlight">' + total + '</span> active auctions and <span class="highlight">' + archivedCount + '</span> archived. ';
    if(total === 0 && archivedCount === 0) { msg = 'No auctions yet. <span class="highlight">Create your first auction</span> from the Products section to start trading!'; }
    text.innerHTML = msg;
  }

  function renderAll() {
    renderCompany();
    renderStats();
    renderWallet();
    renderCertificates();
    renderProducts();
    renderOrders();
    renderTAR();
    renderArchive();
    renderAuctionSchedule();
    renderTARAdvisory();
  }

  // ============================================================
  // FILE UPLOADS
  // ============================================================
  function setupFileUploads() {
    // Company logo
    var logoUpload = $('companyLogoUpload');
    var logoInput = $('logoFileInput');
    if(logoUpload && logoInput) {
      logoUpload.onclick = function(e) { e.preventDefault(); logoInput.click(); };
      logoInput.onchange = function(e) {
        var file = e.target.files[0];
        if(!file) return;
        var valid = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
        if(valid.indexOf(file.type) === -1) { showToast('Invalid file type. Please upload JPG, PNG, GIF, or WEBP.', 'error'); this.value = ''; return; }
        if(file.size > 5 * 1024 * 1024) { showToast('Logo file too large. Max 5MB.', 'error'); this.value = ''; return; }
        showToast('⏳ Uploading logo...', 'info');
        var reader = new FileReader();
        reader.onload = function(ev) {
          APP.company.logo = ev.target.result;
          saveData(APP);
          renderCompany();
          showToast('✅ Logo uploaded!', 'success');
        };
        reader.onerror = function() { showToast('Failed to read logo file', 'error'); };
        reader.readAsDataURL(file);
        this.value = '';
      };
    }
    
    // Photos
    var photoInput = $('photoFileInput');
    if(photoInput) {
      photoInput.onchange = function(e) {
        var files = e.target.files;
        if(files.length === 0) return;
        var valid = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
        var loaded = 0;
        var total = files.length;
        Array.from(files).forEach(function(file) {
          if(valid.indexOf(file.type) === -1) { showToast('Skipping ' + file.name + ': invalid type', 'warning'); loaded++; if(loaded === total) { saveData(APP); renderCompany(); } return; }
          if(file.size > 5 * 1024 * 1024) { showToast('Skipping ' + file.name + ': exceeds 5MB', 'warning'); loaded++; if(loaded === total) { saveData(APP); renderCompany(); } return; }
          if(loaded === 0) showToast('⏳ Uploading photos...', 'info');
          var reader = new FileReader();
          reader.onload = function(ev) {
            if(!APP.company.photos) APP.company.photos = [];
            APP.company.photos.push(ev.target.result);
            loaded++;
            if(loaded === total) { saveData(APP); renderCompany(); showToast('✅ ' + total + ' photo(s) uploaded!', 'success'); }
          };
          reader.onerror = function() { loaded++; showToast('Failed to read ' + file.name, 'warning'); if(loaded === total) { saveData(APP); renderCompany(); } };
          reader.readAsDataURL(file);
        });
        this.value = '';
      };
    }
    
    // Documents
    function handleDocUpload(e, key, statusId) {
      var file = e.target.files[0];
      if(!file) return;
      var valid = ['application/pdf', 'image/jpeg', 'image/png', 'image/gif', 'image/webp'];
      if(valid.indexOf(file.type) === -1) { showToast('Invalid file type. Please upload PDF, JPG, PNG, GIF, or WEBP.', 'error'); e.target.value = ''; return; }
      if(file.size > 10 * 1024 * 1024) { showToast('Document too large. Max 10MB.', 'error'); e.target.value = ''; return; }
      showToast('⏳ Uploading document...', 'info');
      var reader = new FileReader();
      reader.onload = function(ev) {
        if(!APP.company.documents) APP.company.documents = {};
        APP.company.documents[key] = ev.target.result;
        saveData(APP);
        renderCompany();
        var el = $(statusId);
        if(el) el.textContent = '✅ Uploaded';
        showToast('✅ Document uploaded!', 'success');
      };
      reader.onerror = function() { showToast('Failed to read file', 'error'); };
      reader.readAsDataURL(file);
      e.target.value = '';
    }
    
    var incorpBtn = $('incorpUploadBtn');
    var licBtn = $('licenseUploadBtn');
    var taxBtn = $('taxUploadBtn');
    var incorpInput = $('incorpFileInput');
    var licInput = $('licenseFileInput');
    var taxInput = $('taxFileInput');
    if(incorpBtn && incorpInput) { incorpBtn.onclick = function(e) { e.preventDefault(); incorpInput.click(); }; incorpInput.onchange = function(e) { handleDocUpload(e, 'incorporation', 'incorpDocStatus'); }; }
    if(licBtn && licInput) { licBtn.onclick = function(e) { e.preventDefault(); licInput.click(); }; licInput.onchange = function(e) { handleDocUpload(e, 'license', 'licenseDocStatus'); }; }
    if(taxBtn && taxInput) { taxBtn.onclick = function(e) { e.preventDefault(); taxInput.click(); }; taxInput.onchange = function(e) { handleDocUpload(e, 'tax', 'taxDocStatus'); }; }
  }

  // ============================================================
  // DEPOSIT
  // ============================================================
  function processDeposit() {
    var amt = prompt('Enter deposit amount ($):', '1000');
    if(amt === null) return;
    var v = parseFloat(amt);
    if(isNaN(v) || v <= 0) { showToast('Invalid amount. Please enter a positive number.', 'error'); return; }
    APP.wallet.balance = Number(APP.wallet.balance) + v;
    saveData(APP);
    renderAll();
    showToast('Deposited ' + money(v), 'success');
  }

  // ============================================================
  // TOUR
  // ============================================================
  function startTour() {
    showToast('🎯 Tour: Welcome to TradeAux!', 'info');
    var steps = ['📊 Stats Dashboard', '🏢 Company Profile', '📜 Certifications', '📦 Products', '📋 Orders'];
    var step = 0;
    function nextStep() {
      if(step >= steps.length) { showToast('🎯 Tour complete!', 'success'); return; }
      showToast('📍 ' + steps[step], 'info');
      step++;
      setTimeout(nextStep, 1500);
    }
    nextStep();
  }

  // ============================================================
  // SIGN OUT - SETS FLAG FOR FORCE RELOAD ON SIGN IN
  // ============================================================
  function signOut() {
    if(confirm('Sign out?')) {
      // Set a flag so when we come back we force a reload
      sessionStorage.setItem('tradeaux_just_signed_in', 'true');
      window.location.href = 'index.html';
    }
  }

  // ============================================================
  // SAVE
  // ============================================================
  function forceSave() {
    saveData(APP);
    showToast('💾 Data saved!', 'success');
  }

  // ============================================================
  // INIT
  // ============================================================
  function init() {
    // Reload data from localStorage on every init
    loadAppData();
    
    setupHeaderLogos();
    setupCompanyName();
    setupFileUploads();
    renderAll();
    
    // Event listeners
    $('depositBtn').addEventListener('click', processDeposit);
    $('authBtn').addEventListener('click', function(e) { e.preventDefault(); signOut(); });
    $('tourBtn').addEventListener('click', startTour);
    $('forceSaveBtn').addEventListener('click', forceSave);
    $('syncCloudBtn').addEventListener('click', function() { forceSave(); showToast('☁️ Synced!', 'success'); });
    $('exportBtn').addEventListener('click', function() {
      var data = loadData();
      if(!data) { showToast('❌ No data to export', 'error'); return; }
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'tradeaux_backup_' + new Date().toISOString().slice(0,10) + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
      showToast('📤 Data exported!', 'success');
    });
    $('importBtn').addEventListener('click', function() {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = function(e) {
        var file = e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
          try {
            var data = JSON.parse(ev.target.result);
            if(data.company || data.products || data.wallet) {
              if(data.company) APP.company = data.company;
              if(data.products) APP.products = data.products;
              if(data.orders) APP.orders = data.orders;
              if(data.receivables) APP.receivables = data.receivables;
              if(data.wallet) APP.wallet = data.wallet;
              if(data.certToggles) APP.certToggles = data.certToggles;
              if(data.briefs) APP.briefs = data.briefs;
              if(data.archivedAuctions) APP.archivedAuctions = data.archivedAuctions;
              if(data.tar) APP.tar = data.tar;
              saveData(APP);
              renderAll();
              showToast('📥 Data imported!', 'success');
            } else {
              showToast('Invalid data format', 'error');
            }
          } catch(err) {
            showToast('Failed to import: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
        this.value = '';
      };
      input.click();
    });
    
    // Archive toggle
    var archiveHeader = $('archiveHeader');
    var archiveCollapse = $('archiveCollapse');
    if(archiveHeader && archiveCollapse) {
      archiveHeader.addEventListener('click', function() {
        archiveCollapse.classList.toggle('open');
        archiveHeader.classList.toggle('open');
      });
    }
    
    // Marketplace and Analytics
    $('marketplaceNav').addEventListener('click', function(e) { e.preventDefault(); showToast('🌐 Marketplace coming soon!', 'info'); });
    $('analyticsNav').addEventListener('click', function(e) { e.preventDefault(); showToast('📊 Analytics coming soon!', 'info'); });
    
    // Cert add
    $('addCertBtn').addEventListener('click', function() {
      var drop = $('certDropdown');
      if(!drop) { showToast('Certificate dropdown not found', 'error'); return; }
      var type = drop.value;
      if(!type) { showToast('Select a certificate type', 'error'); return; }
      if(APP.certToggles[type] !== undefined) { showToast('Certificate already added', 'warning'); return; }
      APP.certToggles[type] = false;
      saveData(APP);
      renderCertificates();
      drop.value = '';
      showToast('Certificate type added!', 'success');
    });
    
    // TAR buttons
    $('tarAutoConvertBtn').addEventListener('click', function() {
      var ready = APP.receivables.filter(function(r) { return r.status === 'ready' && !r.converted && r.amount >= 1.00; });
      if(ready.length === 0) { showToast('No ready receivables to convert', 'warning'); return; }
      var count = 0;
      ready.forEach(function(r) {
        if(!r.converted) {
          var fee = 25;
          var payout = r.amount - fee;
          if(payout < 0 && APP.wallet.balance < Math.abs(payout)) return;
          r.converted = true;
          r.convertedAt = new Date().toISOString();
          APP.wallet.balance = Number(APP.wallet.balance) + payout;
          APP.tar.totalConversions = (APP.tar.totalConversions || 0) + 1;
          APP.tar.todayConversions = (APP.tar.todayConversions || 0) + 1;
          APP.tar.totalFeesEarned = (APP.tar.totalFeesEarned || 0) + fee;
          count++;
        }
      });
      if(count === 0) { showToast('No receivables could be converted', 'warning'); return; }
      saveData(APP);
      renderAll();
      showToast('✅ Auto-converted ' + count + ' receivables!', 'success');
    });
    
    $('tarAdviceBtn').addEventListener('click', function() { showToast('💡 TAR Advisory: Check your receivables and auctions!', 'info'); });
    $('tarSettingsBtn').addEventListener('click', function() { showToast('⚙️ TAR Settings: Fee $25 • Batch 50 • Auto-Convert ON', 'info'); });
    $('auctionRefreshBtn').addEventListener('click', function() { renderAll(); showToast('🔄 Refreshed!', 'success'); });
    
    // Edit company
    $('editCompanyBtn').addEventListener('click', function() {
      var name = prompt('Enter company name:', APP.company.name || '');
      if(name !== null && name.trim() !== '') {
        APP.company.name = name.trim();
        saveData(APP);
        renderAll();
        showToast('✅ Company name updated!', 'success');
      }
    });
    
    showToast('✅ Dashboard ready!', 'success');
  }

  // ============================================================
  // START - WITH FORCED LOAD
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {
    // Reload data one more time right before init
    loadAppData();
    init();
  });
  </script>
</body>
</html>
