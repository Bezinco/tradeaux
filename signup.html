<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sign In — TradeAux</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #020617;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  color: #e5e7eb;
}
.container {
  max-width: 450px;
  margin: 0 auto;
  padding: 40px 24px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.gem-text {
  font-size: 64px;
  font-weight: 900;
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  background: linear-gradient(135deg, #00ced1, #7CFC00);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 20px;
}
.subtitle {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 40px;
}
.auth-card {
  background: linear-gradient(145deg, rgba(15, 32, 64, 0.8), rgba(2, 6, 23, 0.95));
  border: 1px solid rgba(0, 206, 209, 0.3);
  border-radius: 20px;
  padding: 40px;
}
input {
  width: 100%;
  padding: 14px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(0,206,209,0.3);
  border-radius: 10px;
  color: white;
  font-family: inherit;
  margin-bottom: 16px;
  font-size: 14px;
}
input:focus {
  outline: none;
  border-color: #00ced1;
}
button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #00ced1, #00ff7f);
  border: none;
  border-radius: 10px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  cursor: pointer;
  margin-top: 8px;
  font-size: 14px;
  color: #000;
  transition: all 0.2s;
}
button:hover {
  transform: scale(1.01);
  box-shadow: 0 0 20px rgba(0,206,209,0.4);
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.error {
  color: #ff6b6b;
  background: rgba(217,43,43,0.2);
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 16px;
  display: none;
  font-size: 13px;
}
.success {
  color: #7CFC00;
  background: rgba(124,252,0,0.1);
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 16px;
  display: none;
  font-size: 13px;
}
.toggle {
  text-align: center;
  margin-top: 20px;
  color: #9ca3af;
  font-size: 13px;
}
.toggle a {
  color: #00ced1;
  cursor: pointer;
  text-decoration: underline;
}
.hint {
  font-size: 11px;
  color: #9ca3af;
  margin-top: -10px;
  margin-bottom: 14px;
}
</style>
</head>
<body>
<div class="container">
  <div class="gem-text">TRADEAUX</div>
  <div class="subtitle" id="subtitle">Welcome back</div>
  <div class="auth-card">
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <!-- SIGN IN VIEW -->
    <div id="signinView">
      <input type="email" id="email" placeholder="Email" autocomplete="email">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button id="signinBtn">Sign In</button>
      <div class="toggle">No account? <a id="showSignup">Create one</a></div>
    </div>

    <!-- SIGN UP VIEW -->
    <div id="signupView" style="display:none">
      <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" autocomplete="new-password">
      <input type="text" id="signupName" placeholder="Your Full Name">
      <input type="text" id="signupCompany" placeholder="Company / Organization Name">
      <div class="hint">You'll pick your home Kontor after signup.</div>
      <button id="signupBtn">Create Account</button>
      <div class="toggle">Already have an account? <a id="showSignin">Sign in</a></div>
    </div>
  </div>
</div>

<script>
// =====================================================
// SUPABASE CONFIGURATION
// =====================================================
const SUPABASE_URL = 'https://pfutaovwbygefummienf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmdXRhb3Z3YnlnZWZ1bW1pZW5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1OTM3OTIsImV4cCI6MjA5MzE2OTc5Mn0.K6KI5Dco1-i6MGMIgXfIUenb3pfE3LtqOMRq2qfar7I';

if (!window.supabase) {
  document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#ff3b3b;font-family:Inter,sans-serif;">❌ Failed to load required libraries. Please check your internet connection and refresh.</div>';
  throw new Error('Supabase not loaded');
}

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =====================================================
// LOGOUT FLAG
// =====================================================
const urlParams = new URLSearchParams(window.location.search);
const isLogout = urlParams.get('logout') === '1';

// =====================================================
// UI HELPERS
// =====================================================
let errorTimeout = null;
let successTimeout = null;

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
  clearTimeout(errorTimeout);
  errorTimeout = setTimeout(() => { el.style.display = 'none'; }, 6000);
}

function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
  clearTimeout(successTimeout);
  successTimeout = setTimeout(() => { el.style.display = 'none'; }, 6000);
}

// =====================================================
// ROLE-BASED REDIRECT
// =====================================================
// role is TEXT[] like ['admin'] or ['buyer','seller']
function getRedirectForRole(roleArray) {
  const roles = Array.isArray(roleArray) ? roleArray : ['buyer'];

  if (roles.includes('admin'))   return 'dashboard-admin.html';
  if (roles.includes('seller'))  return 'dashboard-seller.html';
  if (roles.includes('carrier')) return 'dashboard-transport.html';
  if (roles.includes('insurer')) return 'dashboard-insurer.html';
  if (roles.includes('banker'))  return 'dashboard-banker.html';
  return 'dashboard-buyer.html';
}

// =====================================================
// PAGE LOAD
// =====================================================
document.addEventListener('DOMContentLoaded', async function() {
  console.log('🚀 Signin page loaded');

  // Handle logout redirect
  if (isLogout) {
    console.log('🔓 Logged out');
    showSuccess('You have been signed out.');
    try { await supabaseClient.auth.signOut(); } catch(e) { /* ignore */ }
    return;
  }

  // Check existing session
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      const { data: profile, error: profileError } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (profileError) {
        console.warn('Profile fetch failed, defaulting to buyer:', profileError.message);
      }

      const roleArray = profile?.role || ['buyer'];
      console.log('🔐 Already signed in as:', roleArray);

      window.location.href = getRedirectForRole(roleArray);
      return;
    }
  } catch(e) { /* ignore */ }

  console.log('📝 No active session — showing signin form');

  // =====================================================
  // TOGGLE SIGNIN / SIGNUP
  // =====================================================
  document.getElementById('showSignup').onclick = () => {
    document.getElementById('signinView').style.display = 'none';
    document.getElementById('signupView').style.display = 'block';
    document.getElementById('subtitle').textContent = 'Create your account';
  };

  document.getElementById('showSignin').onclick = () => {
    document.getElementById('signupView').style.display = 'none';
    document.getElementById('signinView').style.display = 'block';
    document.getElementById('subtitle').textContent = 'Welcome back';
  };

  // =====================================================
  // SIGN IN
  // =====================================================
  document.getElementById('signinBtn').onclick = async () => {
    const btn = document.getElementById('signinBtn');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showError('Please enter email and password');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) throw error;

      const user = data.user;

      // Fetch role from profiles
      const { data: profile, error: profileError } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (profileError) {
        console.warn('Profile fetch failed:', profileError.message);
      }

      const roleArray = profile?.role || ['buyer'];
      console.log('✅ Signed in:', email, '→', roleArray);

      window.location.href = getRedirectForRole(roleArray);

    } catch (error) {
      console.error('Signin error:', error);
      showError(error.message || 'Sign in failed');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  };

  // =====================================================
  // SIGN UP
  // =====================================================
  document.getElementById('signupBtn').onclick = async () => {
    const btn = document.getElementById('signupBtn');
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const name = document.getElementById('signupName').value.trim();
    const company = document.getElementById('signupCompany').value.trim();

    if (!email || !password) {
      showError('Please enter email and password');
      return;
    }
    if (password.length < 6) {
      showError('Password must be at least 6 characters');
      return;
    }
    if (!name) {
      showError('Please enter your full name');
      return;
    }
    if (!company) {
      showError('Please enter your Company / Organization name');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      // Step 1: Create auth user
      // The database trigger `on_auth_user_created` will automatically create:
      //   - profiles row with role = ['buyer']
      //   - wallets row with balance = 0, currency = CAD
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: name,
            company_name: company
          }
        }
      });

      if (error) throw error;

      const user = data.user;

      if (!user) {
        throw new Error('Account creation returned no user');
      }

      // Step 2: Give the trigger a moment to complete
      await new Promise(resolve => setTimeout(resolve, 500));

      // Step 3: Update full name on the profile (trigger set a default)
      const { error: updateError } = await supabaseClient
        .from('profiles')
        .update({
          full_name: name
        })
        .eq('id', user.id);

      if (updateError) {
        console.warn('Profile update warning:', updateError.message);
      }

      // Step 4: Try to create a company record
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (sessionData?.session) {
        const { error: companyError } = await supabaseClient
          .from('companies')
          .insert({
            user_id: user.id,
            name: company,
            business_type: 'importer'   // default; user picks real one later
          });

        if (companyError) {
          console.warn('Company creation warning:', companyError.message);
        }
      }

      // Step 5: Auto sign in
      const { error: signInError } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (signInError) {
        if (signInError.message && signInError.message.toLowerCase().includes('email not confirmed')) {
          showSuccess('✅ Account created! Please check your email to confirm, then sign in.');
          btn.disabled = false;
          btn.textContent = 'Create Account';
          return;
        }
        throw signInError;
      }

      // Step 6: Redirect to buyer dashboard
      console.log('✅ Account created and signed in:', email);
      window.location.href = 'dashboard-buyer.html';

    } catch (error) {
      console.error('Signup error:', error);

      const msg = (error.message || '').toLowerCase();

      if (msg.includes('email not confirmed')) {
        showSuccess('✅ Account created! Please check your email to confirm, then sign in.');
      } else if (msg.includes('already registered') || msg.includes('already exists')) {
        showError('This email is already registered. Try signing in instead.');
      } else if (msg.includes('password')) {
        showError('Password is too weak or invalid.');
      } else {
        showError(error.message || 'Sign up failed');
      }

      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  };

  // =====================================================
  // ENTER KEY SUPPORT
  // =====================================================
  document.getElementById('password').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('signinBtn').click();
  });
  document.getElementById('signupPassword').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('signupBtn').click();
  });
});
</script>
</body>
</html>
