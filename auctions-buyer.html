<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>TradeAux • Buyer Auctions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020617; font-family: 'Inter', sans-serif; color: #e5e7eb; min-height: 100vh; }
    .bg-waves { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .wave-bg { position: absolute; width: 200%; height: 200%; filter: blur(100px); opacity: 0.2; animation: waveBgDrift 24s ease-in-out infinite; }
    .wave-emerald-bg { background: radial-gradient(circle at 30% 40%, rgba(124,252,0,0.4), transparent 70%); top: -40%; left: -20%; animation-delay: 0s; }
    .wave-sapphire-bg { background: radial-gradient(circle at 50% 50%, rgba(0,206,209,0.4), transparent 70%); top: -30%; left: -10%; animation-delay: 8s; }
    .wave-ruby-bg { background: radial-gradient(circle at 70% 60%, rgba(158,74,74,0.4), transparent 70%); top: -20%; left: 0%; animation-delay: 16s; }
    @keyframes waveBgDrift { 0% { transform: translate(0,0) scale(1); opacity: 0.15; } 50% { transform: translate(40px,-30px) scale(1.05); opacity: 0.25; } 100% { transform: translate(-30px,20px) scale(1); opacity: 0.15; } }
    .container { max-width: 1400px; margin: 0 auto; padding: 40px 24px 60px; position: relative; z-index: 2; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 30px; flex-wrap: wrap; gap: 16px; }
    .logo { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #00ced1, #7CFC00); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .nav a { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 500; padding: 10px 20px; border: 1px solid rgba(0,206,209,0.3); border-radius: 8px; background: rgba(15,32,64,0.7); backdrop-filter: blur(4px); color: #e5e7eb; text-decoration: none; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; }
    .nav a:hover { border-color: #00ced1; transform: translateY(-2px); }
    .nav a.active { border-color: #7CFC00; background: rgba(124,252,0,0.12); color: #7CFC00; }
    .nav a.sign-out { color: #ff3b3b; border-color: rgba(255,59,59,0.3); }
    .wallet-section { display: flex; align-items: center; gap: 16px; background: rgba(0,206,209,0.1); padding: 8px 20px; border-radius: 40px; border: 1px solid rgba(0,206,209,0.3); flex-wrap: wrap; }
    .wallet-balance { display: flex; align-items: baseline; gap: 6px; }
    .wallet-label { font-size: 11px; color: #9ca3af; letter-spacing: 1px; }
    .wallet-amount { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; color: #00ced1; }
    .wallet-sub { font-size: 11px; color: #7CFC00; }
    .page-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 30px; flex-wrap: wrap; gap: 16px; border-bottom: 2px solid rgba(0,206,209,0.15); margin-bottom: 24px; }
    .page-title { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 700; color: #00ced1; }
    .page-title span { background: linear-gradient(135deg, #7CFC00, #00ced1); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .status-tabs { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .status-tab { padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(0,206,209,0.2); background: rgba(0,0,0,0.3); color: #9ca3af; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; }
    .status-tab:hover { border-color: #00ced1; color: #e5e7eb; }
    .status-tab.active { background: rgba(0,206,209,0.1); border-color: #00ced1; color: #00ced1; }
    .status-tab .count { background: rgba(0,206,209,0.1); padding: 1px 8px; border-radius: 12px; font-size: 10px; margin-left: 6px; }
    .type-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .type-btn { padding: 6px 16px; border-radius: 16px; border: 1px solid rgba(0,206,209,0.15); background: transparent; color: #9ca3af; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; }
    .type-btn:hover { border-color: #00ced1; color: #e5e7eb; }
    .type-btn.active { background: rgba(0,206,209,0.1); border-color: #00ced1; color: #00ced1; }
    .search-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .search-bar input { flex: 1; min-width: 180px; padding: 10px 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(0,206,209,0.2); border-radius: 10px; color: #e5e7eb; font-family: 'Inter', sans-serif; font-size: 14px; }
    .search-bar input:focus { outline: none; border-color: #00ced1; }
    .search-bar .results-count { font-size: 13px; color: #9ca3af; margin-left: auto; }
    .auctions-grid { display: grid; gap: 20px; }
    .auction-card { background: linear-gradient(145deg, rgba(15,32,64,0.8), rgba(2,6,23,0.95)); border: 1px solid rgba(0,206,209,0.15); border-radius: 20px; padding: 24px; transition: all 0.3s; }
    .auction-card:hover { border-color: #00ced1; transform: translateY(-2px); }
    .auction-card.reserved { border-color: rgba(124,252,0,0.4); background: linear-gradient(145deg, rgba(15,50,30,0.6), rgba(2,6,23,0.95)); }
    .auction-card .top-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .auction-card .auction-number { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; color: #FFD966; letter-spacing: 0.5px; }
    .auction-card .type-badge { font-size: 10px; padding: 3px 12px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
    .auction-card .type-badge.sample { background: rgba(0,206,209,0.2); color: #00ced1; }
    .auction-card .type-badge.regular { background: rgba(124,252,0,0.15); color: #7CFC00; }
    .auction-card .type-badge.pallet { background: rgba(255,217,102,0.15); color: #FFD966; }
    .auction-card .status-badge { font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
    .auction-card .status-badge.open, .auction-card .status-badge.active { background: rgba(124,252,0,0.2); color: #7CFC00; }
    .auction-card .status-badge.upcoming { background: rgba(0,206,209,0.2); color: #00ced1; }
    .auction-card .status-badge.closed, .auction-card .status-badge.ended, .auction-card .status-badge.settled { background: rgba(255,255,255,0.1); color: #9ca3af; }
    .auction-card .status-badge.reserved { background: rgba(124,252,0,0.2); color: #7CFC00; }
    .auction-card .status-badge.live { background: rgba(124,252,0,0.2); color: #7CFC00; }
    .auction-card .product-name { font-size: 22px; font-weight: 700; color: #e5e7eb; margin-bottom: 4px; }
    .auction-card .seller-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 13px; color: #9ca3af; flex-wrap: wrap; }
    .auction-card .lot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
    .auction-card .lot-grid .lot-item { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 12px; text-align: center; border: 1px solid rgba(0,206,209,0.1); }
    .auction-card .lot-grid .lot-item .label { font-size: 10px; color: #9ca3af; text-transform: uppercase; margin-bottom: 4px; }
    .auction-card .lot-grid .lot-item .value { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; color: #00ced1; }
    .auction-card .lot-grid .lot-item .value.price { color: #7CFC00; }
    .auction-card .actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
    .auction-card .btn-reserve { padding: 10px 28px; border-radius: 8px; border: none; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; background: linear-gradient(135deg, #00ced1, #00ff7f); color: #000; }
    .auction-card .btn-reserve:hover { transform: scale(1.02); }
    .auction-card .btn-secondary { padding: 10px 24px; border-radius: 8px; border: 1px solid rgba(0,206,209,0.3); background: rgba(0,206,209,0.08); color: #00ced1; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
    .auction-card .btn-secondary:hover { background: rgba(0,206,209,0.15); }
    .auction-card .btn-danger { padding: 10px 24px; border-radius: 8px; border: 1px solid rgba(255,59,59,0.3); background: rgba(255,59,59,0.1); color: #ff3b3b; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
    .auction-card .btn-danger:hover { background: rgba(255,59,59,0.2); }
    .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; grid-column: 1 / -1; }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(15,32,64,0.98); border: 1px solid #00ced1; padding: 12px 24px; border-radius: 40px; font-family: 'Orbitron', sans-serif; font-size: 14px; transition: 0.3s; opacity: 0; z-index: 20000; max-width: 90vw; text-align: center; pointer-events: none; }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: #ff3b3b; color: #ff3b3b; }
    .toast.success { border-color: #7CFC00; color: #7CFC00; }
    .toast.warning { border-color: #FFD966; color: #FFD966; }
    .toast.info { border-color: #00ced1; color: #00ced1; }
    .footer { text-align: center; padding: 40px 20px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 40px; font-size: 12px; color: #9ca3af; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
    .modal.show { display: flex; }
    .modal-content { background: linear-gradient(145deg, #0a1228, #020617); border: 2px solid #00ced1; border-radius: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 20px; font-size: 28px; cursor: pointer; color: #9ca3af; background: none; border: none; }
    .modal-close:hover { color: #00ced1; }
    .modal h2 { font-family: 'Orbitron', sans-serif; color: #00ced1; margin-bottom: 20px; font-size: 22px; }
    .modal-field { margin-bottom: 18px; }
    .modal-field label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .modal-field input, .modal-field select, .modal-field textarea { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,206,209,0.3); border-radius: 8px; color: white; font-family: 'Inter', sans-serif; font-size: 14px; }
    .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { outline: none; border-color: #00ced1; }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
    .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .cancel-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #e5e7eb; }
    .create-btn { background: linear-gradient(135deg, #00ced1, #00ff7f); border: none; color: #000; }
  </style>
</head>
<body>
  <div class="bg-waves">
    <div class="wave-bg wave-emerald-bg"></div>
    <div class="wave-bg wave-sapphire-bg"></div>
    <div class="wave-bg wave-ruby-bg"></div>
  </div>

  <main class="container">
    <header class="header">
      <div class="logo">⚡ TRADEAUX</div>
      <nav class="nav">
        <div class="wallet-section">
          <div class="wallet-balance">
            <span class="wallet-label">💰 BALANCE</span>
            <span class="wallet-amount" id="walletAmount">$0.00</span>
            <span class="wallet-sub" id="heldAmount">$0.00 held</span>
          </div>
        </div>
        <a href="dashboard-buyer.html">📊 Dashboard</a>
        <a href="container-captain.html">📦 Containers</a>
        <a href="bot-studio.html">🤖 Bot Studio</a>
        <a href="auctions-buyer.html" class="active">📅 Auctions</a>
        <a href="orders-buyer.html">📋 Orders</a>
        <a href="#" id="authBtn" class="sign-out">🚪 Sign Out</a>
      </nav>

    <div class="page-header">
      <div class="page-title">📅 <span>Auctions</span></div>

    </div>

    <div class="status-tabs" id="statusTabs">
      <button class="status-tab active" data-filter="all">📊 All <span class="count" id="countAll">0</span></button>
      <button class="status-tab" data-filter="live">🟢 Live <span class="count" id="countLive">0</span></button>
      <button class="status-tab" data-filter="upcoming">📅 Upcoming <span class="count" id="countUpcoming">0</span></button>
      <button class="status-tab" data-filter="completed">✅ Completed <span class="count" id="countCompleted">0</span></button>
    </div>

    <div class="type-filter" id="typeFilter">
      <button class="type-btn active" data-type="all">All Types</button>
      <button class="type-btn" data-type="sample">🧪 Sample</button>
      <button class="type-btn" data-type="regular">📦 Regular</button>
      <button class="type-btn" data-type="pallet">📦 Pallet</button>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 Search by product, seller, auction #..." autocomplete="off">

    <div class="auctions-grid" id="auctionsGrid">
      <div class="empty-state">

        <h3>Loading auctions...</h3>
      </div>

    <footer class="footer">
      <p>TRADEAUX © 2026 • Global Commodity Exchange</p>
    </footer>
  </main>

  <div class="toast" id="toast"></div>

  <div class="modal" id="createBotModal">
    <div class="modal-content">
      <button class="modal-close" id="closeCreateBotModal">&times;</button>
      <h2>🤖 Create Bot</h2>
      <div class="modal-field">
        <label>Bot Name</label>
        <input type="text" id="botName" placeholder="e.g., Coffee King" maxlength="60">
      </div>
      <div class="modal-field">
        <label>Designation</label>
        <select id="botDesignation">
          <option value="core">Core — Primary bidder, targets main lots</option>
          <option value="filler">Filler — Bids small lots to top off containers</option>
          <option value="sampler">Sampler — Bids on sample auctions</option>
          <option value="pallet">Pallet — Targets pallet-size auctions</option>
        </select>
      </div>

        <label>Commodity</label>
        <input type="text" id="botCommodity" placeholder="e.g., Coffee, Cocoa, or All" value="All" maxlength="40">
      </div>
      <div class="modal-field">
        <label>Strategy Notes (optional)</label>
        <textarea id="botStrategy" rows="3" placeholder="Plain English instructions for the bot..." maxlength="500"></textarea>

  <div class="modal" id="assignBotModal">
    <div class="modal-content">
      <button class="modal-close" id="closeAssignModal">&times;</button>
      <h2>🤖 Assign Bot</h2>
      <p style="color:#9ca3af;font-size:13px;margin-bottom:16px;" id="assignAuctionLabel">Auction: —</p>

        <label>Choose a bot</label>
        <select id="assignBotSelect"></select>
      </div>

        <button class="cancel-btn" id="cancelAssign">Cancel</button>
        <button class="create-btn" id="confirmAssign">Assign Bot</button>
      </div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';
    var SUPABASE_URL = 'https://pfutaovwbygefummienf.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmdXRhb3Z3YnlnZWZ1bW1pZW5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1OTM3OTIsImV4cCI6MjA5MzE2OTc5Mn0.K6KI5Dco1-i6MGMIgXfIUenb3pfE3LtqOMRq2qfar7I';
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var $ = function(id) { return document.getElementById(id); };
    var money = function(n) { return (n === undefined || n === null || isNaN(n)) ? '$0.00' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    var escapeHtml = function(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };

    function showToast(msg, type) {
      type = type || 'info';
      var t = $('toast'); if (!t) return;
      t.textContent = msg.length > 70 ? msg.substring(0,67)+'...' : msg;
      t.className = 'toast visible ' + type;
      clearTimeout(t._timeout);
      t._timeout = setTimeout(function() { t.className = 'toast'; }, 5000);
    }

    var currentUser = null;
    var userProfile = null;
    var userWallet = null;
    var auctions = [];
    var reservations = [];
    var assignments = [];
    var bots = [];
    var currentStatusFilter = 'all';
    var currentTypeFilter = 'all';
    var currentAssignAuctionId = null;
    var botLoopTimer = null;
    var realtimeChannel = null;

    async function initUser() {
      var sessionRes = await supabase.auth.getSession();
      var session = sessionRes.data ? sessionRes.data.session : null;
      if (!session) {
        showToast('Please sign in', 'error');
        setTimeout(function() { window.location.href = 'index.html'; }, 1500);
        return false;
      }
      currentUser = session.user;

      var profRes = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
      userProfile = profRes.data || {};

      var walletRes = await supabase.from('wallets').select('*').eq('user_id', currentUser.id).maybeSingle();
      var wallet = walletRes.data;
      if (!wallet) {
        var newRes = await supabase.from('wallets').insert({ user_id: currentUser.id, balance: 0, held_balance: 0, currency: 'USD' }).select().single();
        wallet = newRes.data;
      }
      userWallet = wallet || { balance: 0, held_balance: 0 };
      renderWallet();
      return true;
    }

    function renderWallet() {
      if ($('walletAmount')) $('walletAmount').textContent = money(userWallet ? userWallet.balance : 0);
      if ($('heldAmount')) $('heldAmount').textContent = money(userWallet ? userWallet.held_balance : 0) + ' held';
    }

    async function loadAuctions() {
      var res = await supabase.from('auctions').select('*').in('status', ['open', 'active', 'upcoming']).order('created_at', { ascending: false });
      if (res.error) { console.error('auctions', res.error); return; }
      auctions = res.data || [];
    }

    async function loadReservations() {
      var res = await supabase.from('buyer_holds').select('*').eq('user_id', currentUser.id).eq('status', 'held');
      if (res.error) { console.error('holds', res.error); return; }
      reservations = res.data || [];
    }

    async function loadAssignments() {
      var res = await supabase.from('auction_bot_assignments').select('*').eq('buyer_id', currentUser.id).in('status', ['assigned', 'active']);
      if (res.error) { console.error('assignments', res.error); return; }
      assignments = res.data || [];
    }

    async function loadBots() {
      var res = await supabase.from('buyer_bots').select('*').eq('buyer_id', currentUser.id).eq('status', 'active');
      if (res.error) { console.error('bots', res.error); return; }
      bots = res.data || [];
    }

    async function loadAll() {
      await Promise.all([loadAuctions(), loadReservations(), loadAssignments(), loadBots()]);
      renderAuctions();
      renderWallet();
    }

    function isReserved(auctionId) { return reservations.some(function(r) { return r.auction_id === auctionId; }); }
    function getAssignment(auctionId) { return assignments.find(function(a) { return a.auction_id === auctionId; }); }
    function getBot(botId) { return bots.find(function(b) { return b.id === botId; }); }

    async function reserveAuction(auctionId) {
      var auction = auctions.find(function(a) { return a.id === auctionId; });
      if (!auction) { showToast('Auction not found', 'error'); return; }
      if (isReserved(auctionId)) { showToast('Already reserved', 'info'); return; }
      if (auction.status !== 'upcoming') { showToast('Reserve is only for upcoming auctions', 'error'); return; }
      var HOLD = 25;
      var available = userWallet ? (userWallet.balance || 0) : 0;
      if (available < HOLD) { showToast('Insufficient balance. Need $25.', 'error'); return; }

      var holdRes = await supabase.from('buyer_holds').insert({
        user_id: currentUser.id, auction_id: auctionId, amount: HOLD, status: 'held'
      });
      if (holdRes.error) { showToast('Failed: ' + holdRes.error.message, 'error'); return; }

      var newBalance = available - HOLD;
      var newHeld = (userWallet.held_balance || 0) + HOLD;
      await supabase.from('wallets').update({ balance: newBalance, held_balance: newHeld, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
      userWallet.balance = newBalance;
      userWallet.held_balance = newHeld;

      await loadAll();
      showToast('Reserved ' + auctionId + ' · $25 held', 'success');
    }

    async function cancelReservation(auctionId) {
      var hold = reservations.find(function(r) { return r.auction_id === auctionId; });
      if (!hold) return;
      var auction = auctions.find(function(a) { return a.id === auctionId; });
      if (auction && auction.status !== 'upcoming') { showToast('Cannot cancel — auction has started', 'error'); return; }
      if (!confirm('Cancel reservation? $25 will be refunded.')) return;

      await supabase.from('buyer_holds').update({ status: 'released', released_at: new Date().toISOString() }).eq('id', hold.id);

      var newBalance = (userWallet.balance || 0) + (hold.amount || 25);
      var newHeld = Math.max(0, (userWallet.held_balance || 0) - (hold.amount || 25));
      await supabase.from('wallets').update({ balance: newBalance, held_balance: newHeld, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
      userWallet.balance = newBalance;
      userWallet.held_balance = newHeld;

      await loadAll();
      showToast('Reservation cancelled, $25 refunded', 'success');
    }

    async function releaseBot(auctionId) {
      var assignment = getAssignment(auctionId);
      if (!assignment) return;
      var auction = auctions.find(function(a) { return a.id === auctionId; });
      if (auction && auction.status !== 'upcoming') { showToast('Cannot release — auction has started', 'error'); return; }
      if (!confirm('Release bot and refund $25?')) return;

      await supabase.from('auction_bot_assignments').update({ status: 'released', ended_at: new Date().toISOString() }).eq('id', assignment.id);

      var hold = reservations.find(function(r) { return r.auction_id === auctionId; });
      if (hold) {
        await supabase.from('buyer_holds').update({ status: 'released', released_at: new Date().toISOString() }).eq('id', hold.id);
        var newBalance = (userWallet.balance || 0) + (hold.amount || 25);
        var newHeld = Math.max(0, (userWallet.held_balance || 0) - (hold.amount || 25));
        await supabase.from('wallets').update({ balance: newBalance, held_balance: newHeld, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
        userWallet.balance = newBalance;
        userWallet.held_balance = newHeld;
      }

      await loadAll();
      showToast('Bot released, $25 refunded', 'success');
    }

    function renderAuctions() {
      var grid = $('auctionsGrid');
      if (!grid) return;
      var list = auctions.slice();
      if (currentStatusFilter !== 'all') {
        var wantStatus = currentStatusFilter === 'live' ? 'open' : currentStatusFilter;
        list = list.filter(function(a) {
          if (wantStatus === 'open') return a.status === 'open' || a.status === 'active';
          if (wantStatus === 'completed') return a.status === 'closed' || a.status === 'ended' || a.status === 'settled';
          return a.status === wantStatus;
        });
      }
      if (currentTypeFilter !== 'all') list = list.filter(function(a) { return a.auction_type === currentTypeFilter; });

      var searchTerm = ($('searchInput') && $('searchInput').value ? $('searchInput').value : '').toLowerCase();
      if (searchTerm) {
        list = list.filter(function(a) {
          return (a.commodity || '').toLowerCase().indexOf(searchTerm) !== -1 ||
                 (a.seller || '').toLowerCase().indexOf(searchTerm) !== -1 ||
                 (a.id || '').toLowerCase().indexOf(searchTerm) !== -1;
        });
      }

      if ($('resultsCount')) $('resultsCount').textContent = 'Showing ' + list.length + ' auction' + (list.length !== 1 ? 's' : '');

      if (list.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div><h3>No auctions available</h3></div>';
        updateCounts();
        return;
      }

      var statusLabels = { open: '🟢 LIVE', active: '🟢 LIVE', upcoming: '📅 UPCOMING', closed: '✅ CLOSED', ended: '✅ ENDED', settled: '✅ SETTLED' };
      var typeLabels = { sample: '🧪 Sample', regular: '📦 Regular', pallet: '📦 Pallet' };

      grid.innerHTML = list.map(function(a) {
        var reserved = isReserved(a.id);
        var assignment = getAssignment(a.id);
        var bot = assignment ? getBot(assignment.bot_id) : null;
        var atype = a.auction_type || 'regular';
        var price = a.current_high || a.start_price || 0;
        var unit = a.price_unit || 'MT';
        var isUpcoming = a.status === 'upcoming';
        var isLive = a.status === 'open' || a.status === 'active';

        var actionHtml = '';
        if (isUpcoming) {
          if (reserved) {
            if (assignment && bot) {
              actionHtml = '<span class="status-badge reserved">🤖 ' + escapeHtml(bot.name) + ' assigned</span>' +
                '<button class="btn-danger" data-action="release" data-id="' + escapeHtml(a.id) + '">Release Bot</button>';
            } else {
              actionHtml = '<span class="status-badge reserved">✅ Reserved</span>' +
                '<button class="btn-reserve" data-action="assign" data-id="' + escapeHtml(a.id) + '">🤖 Assign Bot</button>' +
                '<button class="btn-danger" data-action="cancel" data-id="' + escapeHtml(a.id) + '">Cancel</button>';
            }
          } else {
            actionHtml = '<button class="btn-reserve" data-action="reserve" data-id="' + escapeHtml(a.id) + '">📋 Reserve · $25</button>';
          }
        } else if (isLive) {
          if (assignment && bot) {
            actionHtml = '<span class="status-badge live">🤖 ' + escapeHtml(bot.name) + ' bidding</span>';
          } else {
            actionHtml = '<span style="color:#9ca3af;font-size:12px;">Auction live · no bot assigned</span>';
          }
        } else {
          actionHtml = '<span class="status-badge completed">' + escapeHtml((a.status || '').toUpperCase()) + '</span>';
        }

        var totalStr = (a.quantity || 0).toLocaleString() + ' ' + unit;
        var minStr = a.min_quantity_kg ? a.min_quantity_kg + 'kg' : '—';
        var maxStr = a.max_quantity_kg ? a.max_quantity_kg + 'kg' : (atype === 'regular' ? 'Full lot' : '—');

        return '<div class="auction-card' + (reserved ? ' reserved' : '') + '" data-id="' + escapeHtml(a.id) + '">' +
          '<div class="top-row">' +
            '<span class="auction-number">' + escapeHtml(a.id) + '</span>' +
            '<span class="type-badge ' + atype + '">' + (typeLabels[atype] || '📦') + '</span>' +
            '<span class="status-badge ' + a.status + '">' + (statusLabels[a.status] || a.status) + '</span>' +
          '</div>' +
          '<div class="product-name">' + escapeHtml(a.commodity || 'Unknown') + (a.variety ? ' — ' + escapeHtml(a.variety) : '') + '</div>' +
          '<div class="seller-row"><span>👤 ' + escapeHtml(a.seller || '—') + '</span><span>📍 ' + escapeHtml(a.fob_port || '—') + '</span></div>' +
          '<div class="lot-grid">' +
            '<div class="lot-item"><div class="label">Total Lot</div><div class="value">' + escapeHtml(totalStr) + '</div></div>' +
            '<div class="lot-item"><div class="label">Min Buy</div><div class="value">' + escapeHtml(minStr) + '</div></div>' +
            '<div class="lot-item"><div class="label">Max Buy</div><div class="value">' + escapeHtml(maxStr) + '</div></div>' +
            '<div class="lot-item"><div class="label">Current</div><div class="value price">' + money(price) + '/' + escapeHtml(unit) + '</div></div>' +
          '</div>' +
          '<div class="actions">' + actionHtml + '</div>' +
        '</div>';
      }).join('');

      grid.querySelectorAll('[data-action="reserve"]').forEach(function(b) { b.addEventListener('click', function() { reserveAuction(this.dataset.id); }); });
      grid.querySelectorAll('[data-action="cancel"]').forEach(function(b) { b.addEventListener('click', function() { cancelReservation(this.dataset.id); }); });
      grid.querySelectorAll('[data-action="assign"]').forEach(function(b) { b.addEventListener('click', function() { openAssignModal(this.dataset.id); }); });
      grid.querySelectorAll('[data-action="release"]').forEach(function(b) { b.addEventListener('click', function() { releaseBot(this.dataset.id); }); });

      updateCounts();
    }

    function updateCounts() {
      var counts = {
        all: auctions.length,
        open: auctions.filter(function(a) { return a.status === 'open' || a.status === 'active'; }).length,
        upcoming: auctions.filter(function(a) { return a.status === 'upcoming'; }).length,
        closed: auctions.filter(function(a) { return a.status === 'closed' || a.status === 'ended' || a.status === 'settled'; }).length
      };
      if ($('countAll')) $('countAll').textContent = counts.all;
      if ($('countLive')) $('countLive').textContent = counts.open;
      if ($('countUpcoming')) $('countUpcoming').textContent = counts.upcoming;
      if ($('countCompleted')) $('countCompleted').textContent = counts.closed;
    }

    function openAssignModal(auctionId) {
      if (bots.length === 0) {
        if (confirm('You have no active bots. Create one now?')) {
          openCreateBotModal();
        }
        return;
      }
      currentAssignAuctionId = auctionId;
      var auction = auctions.find(function(a) { return a.id === auctionId; });
      if ($('assignAuctionLabel')) $('assignAuctionLabel').textContent = 'Auction: ' + auctionId + ' · ' + (auction ? auction.commodity : '');
      var sel = $('assignBotSelect');
      sel.innerHTML = bots.map(function(b) {
        return '<option value="' + escapeHtml(b.id) + '">' + escapeHtml(b.name) + ' · ' + escapeHtml(b.designation) + ' · ' + escapeHtml(b.commodity) + '</option>';
      }).join('');
      $('assignBotModal').classList.add('show');
    }

    async function confirmAssign() {
      var botId = $('assignBotSelect').value;
      if (!botId || !currentAssignAuctionId) { showToast('Select a bot', 'error'); return; }
      if (!isReserved(currentAssignAuctionId)) { showToast('Reserve the auction first', 'error'); return; }
      if (getAssignment(currentAssignAuctionId)) { showToast('A bot is already assigned', 'info'); return; }

      var hold = reservations.find(function(r) { return r.auction_id === currentAssignAuctionId; });
      var insertRes = await supabase.from('auction_bot_assignments').insert({
        auction_id: currentAssignAuctionId,
        bot_id: botId,
        buyer_id: currentUser.id,
        hold_id: hold ? hold.id : null,
        status: 'assigned'
      });
      if (insertRes.error) { showToast('Assign failed: ' + insertRes.error.message, 'error'); return; }

      $('assignBotModal').classList.remove('show');
      await loadAll();
      showToast('Bot assigned to ' + currentAssignAuctionId, 'success');
      currentAssignAuctionId = null;
    }

    function openCreateBotModal() {
      $('botName').value = '';
      $('botDesignation').value = 'core';
      $('botCommodity').value = 'All';
      $('botStrategy').value = '';
      $('createBotModal').classList.add('show');
    }

    async function confirmCreateBot() {
      var name = ($('botName').value || '').trim();
      var designation = $('botDesignation').value;
      var commodity = ($('botCommodity').value || 'All').trim();
      var notes = ($('botStrategy').value || '').trim();

      if (!name) { showToast('Bot name required', 'error'); return; }
      if (name.length < 2) { showToast('Bot name too short', 'error'); return; }
      if (['core','filler','sampler','pallet'].indexOf(designation) === -1) { showToast('Invalid designation', 'error'); return; }

      var strategy = notes ? { notes: notes } : {};

      var insertRes = await supabase.from('buyer_bots').insert({
        buyer_id: currentUser.id,
        name: name,
        designation: designation,
        commodity: commodity || 'All',
        strategy: strategy,
        status: 'active'
      });
      if (insertRes.error) { showToast('Create failed: ' + insertRes.error.message, 'error'); return; }

      $('createBotModal').classList.remove('show');
      await loadBots();
      renderAuctions();
      showToast('Bot "' + name + '" created', 'success');
    }

    async function runBotTick() {
      if (!currentUser || assignments.length === 0) return;
      for (var i = 0; i < assignments.length; i++) {
        var asg = assignments[i];
        if (asg.status !== 'active') continue;
        var auction = auctions.find(function(a) { return a.id === asg.auction_id; });
        if (!auction) continue;
        if (auction.status !== 'open' && auction.status !== 'active') continue;

        var bot = getBot(asg.bot_id);
        if (!bot) continue;

        var base = auction.current_high || auction.start_price || 1;
        var jitter = (Math.random() - 0.5) * 0.1 * base;
        var price = Math.max(0.01, Math.round((base + jitter) * 100) / 100);
        var qty = Math.max(1, Math.round((auction.quantity || 10) * 0.1));

        var bidRes = await supabase.from('bids').insert({
          auction_id: auction.id,
          bidder: bot.name || 'Bot',
          quantity: qty,
          price: price,
          buyer_id: currentUser.id,
          buyer_name: userProfile ? (userProfile.company_name || userProfile.full_name || 'Buyer') : 'Buyer',
          buyer_email: currentUser.email,
          buyer_contact: userProfile ? (userProfile.full_name || 'Buyer') : 'Buyer',
          status: 'pending',
          timestamp: new Date().toISOString(),
          hold_released: false,
          fee_deducted: false
        });
        if (bidRes.error) console.error('Bot bid error:', bidRes.error);
      }
    }

    function startBotLoop() {
      if (botLoopTimer) clearInterval(botLoopTimer);
      botLoopTimer = setInterval(runBotTick, 5000);
    }

    function setupEvents() {
      document.querySelectorAll('.status-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.status-tab').forEach(function(t) { t.classList.remove('active'); });
          this.classList.add('active');
          currentStatusFilter = this.dataset.filter;
          renderAuctions();
        });
      });
      document.querySelectorAll('.type-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.type-btn').forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
          currentTypeFilter = this.dataset.type;
          renderAuctions();
        });
      });
      var searchTimeout;
      if ($('searchInput')) {
        $('searchInput').addEventListener('input', function() {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(renderAuctions, 200);
        });
      }
      if ($('authBtn')) {
        $('authBtn').addEventListener('click', async function(e) {
          e.preventDefault();
          if (confirm('Sign out?')) {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
          }
        });
      }
      if ($('closeCreateBotModal')) $('closeCreateBotModal').addEventListener('click', function() { $('createBotModal').classList.remove('show'); });
      if ($('cancelCreateBot')) $('cancelCreateBot').addEventListener('click', function() { $('createBotModal').classList.remove('show'); });
      if ($('confirmCreateBot')) $('confirmCreateBot').addEventListener('click', confirmCreateBot);
      if ($('closeAssignModal')) $('closeAssignModal').addEventListener('click', function() { $('assignBotModal').classList.remove('show'); currentAssignAuctionId = null; });
      if ($('cancelAssign')) $('cancelAssign').addEventListener('click', function() { $('assignBotModal').classList.remove('show'); currentAssignAuctionId = null; });
      if ($('confirmAssign')) $('confirmAssign').addEventListener('click', confirmAssign);
      document.querySelectorAll('.modal').forEach(function(m) {
        m.addEventListener('click', function(e) { if (e.target === m) { m.classList.remove('show'); currentAssignAuctionId = null; } });
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          document.querySelectorAll('.modal').forEach(function(m) { m.classList.remove('show'); });
          currentAssignAuctionId = null;
        }
      });
    }

    function subscribeRealtime() {
      if (realtimeChannel) supabase.removeChannel(realtimeChannel);
      realtimeChannel = supabase.channel('buyer-auctions')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'auctions' }, async function() {
          await loadAuctions();
          renderAuctions();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'auction_bot_assignments' }, async function() {
          await loadAssignments();
          renderAuctions();
        })
        .subscribe();
    }

    async function init() {
      var ok = await initUser();
      if (!ok) return;
      await loadAll();
      setupEvents();
      subscribeRealtime();
      startBotLoop();
      showToast('Auctions loaded', 'info');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
